name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lint deps
        # Install only the lightweight runtime subset the linter and type
        # checker actually need. Heavy compiled extensions (catboost, xgboost,
        # lightgbm, dvc, shap, optuna) are excluded; mypy resolves those via
        # ignore_missing_imports = true in pyproject.toml.
        run: |
          pip install ruff mypy types-PyYAML
          pip install --no-deps -e .
          pip install \
            pandas numpy scikit-learn scipy \
            fastapi pydantic loguru joblib mlflow pyyaml pyarrow
      - name: Lint
        run: ruff check src/ tests/
      - name: Type check
        run: mypy src/

  test:
    runs-on: ubuntu-latest
    needs: lint-and-type
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest --cov=src --cov-report=xml -q
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
