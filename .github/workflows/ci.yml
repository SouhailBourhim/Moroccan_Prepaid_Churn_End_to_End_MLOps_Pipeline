name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lint deps
        # Install the package (so mypy can resolve internal imports) plus
        # the required type stubs. Heavy ML deps (catboost, xgboost…) are
        # excluded here via --no-deps on the package itself; mypy only needs
        # the source tree, not the compiled extensions.
        run: |
          pip install ruff mypy types-PyYAML
          pip install --no-deps -e .
          pip install pandas numpy scikit-learn fastapi pydantic loguru joblib mlflow pyyaml
      - name: Lint
        run: ruff check src/
      - name: Type check
        run: mypy src/

  test:
    runs-on: ubuntu-latest
    needs: lint-and-type
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest --cov=src --cov-report=xml -q
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
