name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lint deps
        # Install only the lightweight runtime subset the linter and type
        # checker actually need. Heavy compiled extensions (catboost, xgboost,
        # lightgbm, dvc, shap, optuna) are excluded; mypy resolves those via
        # ignore_missing_imports = true in pyproject.toml.
        run: |
          pip install ruff mypy types-PyYAML
          pip install --no-deps -e .
          pip install \
            pandas numpy scikit-learn scipy \
            fastapi pydantic loguru joblib mlflow pyyaml pyarrow
      - name: Lint
        run: ruff check src/ tests/
      - name: Type check
        run: mypy src/

  test:
    runs-on: ubuntu-latest
    needs: lint-and-type
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest --cov=src --cov-report=xml -q
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --target runtime -t churn-api:ci .
      - name: Smoke-test liveness and fail-closed auth
        run: |
          docker run -d --name api -p 8000:8000 churn-api:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && break
            sleep 1
          done
          curl -fsS http://localhost:8000/health
          # /logs needs no model; with no CHURN_API_KEYS it must refuse (503), not run open.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/logs)" = "503"
          docker rm -f api
