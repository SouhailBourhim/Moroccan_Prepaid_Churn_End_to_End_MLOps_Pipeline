[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moroccan-churn"
version = "0.1.0"
description = "Production-grade prepaid churn prediction pipeline"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "catboost>=1.2",
    "shap>=0.45",
    "mlflow>=2.12",
    "dvc>=3.49",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.21",
    "scipy>=1.13",
    "imbalanced-learn>=0.12",
    "optuna>=3.6",
    "joblib>=1.4",
    "pyarrow>=16",
    "rich>=13",
    "loguru>=0.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "pre-commit>=3.7",
    "jupyter>=1.0",
    "ipykernel>=6",
    "nbformat>=5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN"]
# N803/N806: sklearn convention uses uppercase X for the feature matrix in fit/transform.
# Renaming to x would diverge from every sklearn transformer in the ecosystem.
ignore = ["N803", "N806"]

[tool.ruff.lint.per-file-ignores]
# ANN401: model parameters span XGBoost/LightGBM/CatBoost/sklearn class hierarchies;
# a shared Protocol would need to cover shap.Explainer's broad acceptance surface.
"src/models/*.py" = ["ANN401"]
# ANN401: test mock uses Any for the X parameter to satisfy the predict_proba duck type.
"tests/test_api.py" = ["ANN401"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# sklearn ships no PEP 561 stubs, so BaseEstimator and TransformerMixin resolve
# as Any. strict mode then rejects subclassing Any ([misc]). Disabling
# disallow_subclassing_any for this module is the targeted fix; all other strict
# checks remain active.
module = "src.features.build_features"
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# catboost ships no PEP 561 stubs; all other strict checks remain active.
module = "src.models.*"
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# ANN401 suppressed at ruff level; mypy strict is fine here.
module = "src.api.*"
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
