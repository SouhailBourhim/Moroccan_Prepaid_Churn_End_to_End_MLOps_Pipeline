services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: expresso-churn-api:latest
    container_name: expresso-churn-api
    ports:
      - "8000:8000"
    # Model artifacts are mounted read-only from the host so the image
    # stays small and models can be updated without rebuilding.
    volumes:
      - ./models:/app/models:ro
      - ./data/features:/app/data/features:ro
    environment:
      - API_WORKERS=4
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
